    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'love-pink': '#ffe4e8',
                        'love-main': '#ff758c',
                        'love-dark': '#ff4b6e',
                        'dark-sad': '#1a1a24'

                        jua: ['Jua', 'sans-serif'],

    <style>
        body {
            font-family: 'Gowun Dodum', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* 하트 흩날리는 배경 애니메이션 */
        .heart-particle {
            position: absolute;
            color: rgba(255, 117, 140, 0.4);
            animation: floatUp 6s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.2) rotate(360deg);
                opacity: 0;
            }
        }
        /* 대화창 페이드 효과 */
        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* 캐릭터 서있는 애니메이션 */
        .character-bounce {
            animation: gentleBounce 3s ease-in-out infinite;
        }
        @keyframes gentleBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .bg-transition {
            transition: background-image 0.7s ease-in-out, background-color 0.7s ease-in-out;
        }
    </style>
</head>
<body class="bg-love-pink min-h-screen flex items-center justify-center p-2 sm:p-4 overflow-hidden relative" id="body-container">

    <!-- floating background hearts -->

        <!-- 0. MAIN TITLE SCREEN (시작 화면) -->

        // 흩날리는 하트 생성 함수
        function createHearts() {
            const container = document.getElementById('heart-container');
            container.innerHTML = '';
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('i');
                heart.className = 'fa-solid fa-heart heart-particle';
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 4 + 4) + 's';
                heart.style.animationDelay = (Math.random() * 5) + 's';
                heart.style.fontSize = (Math.random() * 15 + 12) + 'px';
                container.appendChild(heart);
            }
        }

        // 게임 시작
        function startGame() {
            isGameStarted = true;
            likeScore = 0;
            currentStep = 0;
            document.getElementById('like-score').innerText = likeScore;
            
            const titleScreen = document.getElementById('title-screen');
            titleScreen.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {
                titleScreen.classList.add('hidden');
            }, 700);

            renderStep();
        }

        // 게임 처음부터 재시작
        function restartGame() {
            likeScore = 0;
            currentStep = 0;
            isChoicePhase = false;
            document.getElementById('like-score').innerText = likeScore;

            // 새드 오버레이 제거
            const sadOverlay = document.getElementById('sad-overlay');
            sadOverlay.classList.add('opacity-0');

            // 타이틀 화면 복구
            const titleScreen = document.getElementById('title-screen');
            titleScreen.classList.remove('hidden');
            setTimeout(() => {
                titleScreen.classList.remove('opacity-0', 'pointer-events-none');
            }, 50);

            // 캐릭터 숨김
            hideAllCharacters();
            
            // 엔딩 버튼 숨김
            document.getElementById('ending-restart-container').classList.add('hidden');
            document.getElementById('click-prompt').classList.remove('hidden');
        }

        // 모든 캐릭터 숨기기 (나레이션/선택지 전용)
        function hideAllCharacters() {
            const jaein = document.getElementById('char-jaein');
            const muhyun = document.getElementById('char-muhyun');
            const simin = document.getElementById('char-simin');

            [jaein, muhyun, simin].forEach(char => {
                char.classList.add('opacity-0', 'translate-y-10');
                char.classList.remove('opacity-100', 'translate-y-0');
            });
        }

        // 특정 캐릭터만 단독 표시
        function showSingleCharacter(charId) {
            hideAllCharacters();
            if (charId === 'jaein') {
                const el = document.getElementById('char-jaein');
                el.classList.remove('opacity-0', 'translate-y-10');
                el.classList.add('opacity-100', 'translate-y-0');
            } else if (charId === 'muhyun') {
                const el = document.getElementById('char-muhyun');
                el.classList.remove('opacity-0', 'translate-y-10');
                el.classList.add('opacity-100', 'translate-y-0');
            } else if (charId === 'simin') {
                const el = document.getElementById('char-simin');
                el.classList.remove('opacity-0', 'translate-y-10');
                el.classList.add('opacity-100', 'translate-y-0');
            }
        }

        // 스텝 렌더링
        function renderStep() {
            const data = storyScript.find(item => item.step === currentStep);
            if (!data) return;

            // 1. 헤더 날짜 & 위치 업데이트
            document.getElementById('game-date').innerText = data.date;
            document.getElementById('location-tag').innerText = data.location;

            // 2. 배경 이미지 및 분위기 연출
            const sceneBg = document.getElementById('scene-background');
            sceneBg.style.backgroundImage = `url('${data.bg}')`;

            if (data.isSadTheme) {
                document.getElementById('sad-overlay').classList.remove('opacity-0');
            } else {
                document.getElementById('sad-overlay').classList.add('opacity-0');
            }

            // 3. 인물 연출 (나레이션/선택지: 0명, 대사: 해당 1명만 단독)
            if (data.type === "narration" || data.type === "choice" || data.type === "ending") {
                hideAllCharacters();
            } else if (data.type === "dialogue" && data.activeChar) {
                showSingleCharacter(data.activeChar);
            }

            // 4. 화자 이름 및 대사 텍스트 업데이트
            const speakerBadge = document.getElementById('speaker-badge');
            const speakerName = document.getElementById('speaker-name');
            const dialogueText = document.getElementById('dialogue-text');
            const dialogueBox = document.getElementById('dialogue-box');

            speakerName.innerText = data.speaker;
            dialogueText.innerText = data.text;

            // 페이드 인 애니메이션 적용
            dialogueBox.classList.remove('fade-in');
            void dialogueBox.offsetWidth; // trigger reflow
            dialogueBox.classList.add('fade-in');

            // 5. 선택지/엔딩 버튼 제어
            const choicesContainer = document.getElementById('choices-container');
            const endingRestartContainer = document.getElementById('ending-restart-container');
            const clickPrompt = document.getElementById('click-prompt');

            if (data.type === "choice") {
                isChoicePhase = true;
                clickPrompt.classList.add('hidden');
                choicesContainer.classList.remove('hidden');
                choicesContainer.classList.add('flex');
                
                choicesContainer.innerHTML = '';
                data.choices.forEach(choice => {
                    const btn = document.createElement('button');
                    btn.className = "w-full bg-pink-50 hover:bg-love-pink text-gray-800 font-medium py-2.5 px-4 rounded-xl border border-pink-300 text-left transition transform hover:scale-[1.01] active:scale-100 shadow-sm text-sm sm:text-base";
                    btn.innerText = choice.text;
                    btn.onclick = (e) => {
                        e.stopPropagation();
                        makeChoice(choice.score, choice.nextStep);
                    };
                    choicesContainer.appendChild(btn);
                });
            } else if (data.type === "ending") {
                isChoicePhase = false;
                choicesContainer.classList.add('hidden');
                clickPrompt.classList.add('hidden');
                endingRestartContainer.classList.remove('hidden');
            } else {
                isChoicePhase = false;
                choicesContainer.classList.add('hidden');
                choicesContainer.classList.remove('flex');
                endingRestartContainer.classList.add('hidden');
                clickPrompt.classList.remove('hidden');
            }
        }

        // 다음 대사 넘기기
        function nextDialogue() {
            if (isChoicePhase) return;

            const currentData = storyScript.find(item => item.step === currentStep);
            if (!currentData) return;

            // 엔딩 자동 판정 트리거 체크
            if (currentData.isEndingTrigger) {
                triggerEndingByScore();
                return;
            }

            // 분기 후 직행(nextDirect) 속성이 있을 경우
            if (currentData.nextDirect !== undefined) {
                currentStep = currentData.nextDirect;
            } else {
                currentStep++;
            }

            renderStep();
        }

        // 선택지 클릭 처리
        function makeChoice(score, nextStep) {
            likeScore += score;
            document.getElementById('like-score').innerText = likeScore;
            
            isChoicePhase = false;
            currentStep = nextStep;
            renderStep();
        }

        // 호감도 수치별 엔딩 분기
        function triggerEndingByScore() {
            if (likeScore >= 80) {
                currentStep = 200; // 엔딩 1
            } else if (likeScore >= 60) {
                currentStep = 300; // 엔딩 2
            } else if (likeScore >= 30) {
                currentStep = 400; // 엔딩 3
            } else {
                currentStep = 500; // 엔딩 4 (새드엔딩)
            }
            renderStep();
        }

        // 초기화 실행
        window.onload = function() {
            createHearts();
        };
    </script>
